<svg xmlns="http://www.w3.org/2000/svg" width="490" height="470" viewBox="0 0 490 470">
<defs>
<style>
.w{font-family:"Arial Black","DejaVu Sans",sans-serif;font-size:76px;font-weight:900;letter-spacing:2px}
.top{fill:#f0f6fc;stroke:#39d353;stroke-width:1}.shadow{fill:#17251d;stroke:#1f6f45;stroke-width:1}
.sub{font-family:monospace;font-size:15px;fill:#8b949e}.cursor{fill:#39d353;animation:blink 1s steps(1,end) infinite}
.wipe{animation:wipe 1.5s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}.rock{transform-origin:245px 105px;animation:rock 5s ease-in-out 1.6s infinite}
@keyframes wipe{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes rock{0%,100%{transform:rotateY(0deg)}50%{transform:rotateY(12deg)}}
@keyframes blink{50%{opacity:0}}
</style>
</defs>
<rect width="490" height="470" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="22" y="30" fill="#8b949e" font-family="monospace" font-size="11">PERO-99 / identity</text>
<g class="rock"><g class="wipe">
<text x="30" y="115" class="w shadow">MANJEET</text>
<text x="24" y="109" class="w shadow">MANJEET</text>
<text x="18" y="103" class="w top">MANJEET</text>
</g></g>
<text x="28" y="155" class="sub">CSE STUDENT · AI BUILDER</text>
<text x="28" y="180" class="sub">HACKATHON DEVELOPER · OPEN SOURCE</text>
<line x1="28" y1="205" x2="462" y2="205" stroke="#30363d"/>
<text x="28" y="238" fill="#58a6ff" font-family="monospace" font-size="14">focus</text>
<text x="28" y="264" fill="#f0f6fc" font-family="monospace" font-size="14">AI · WEB · CLOUD · ML</text>
