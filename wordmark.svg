<text x="28" y="332" fill="#f0f6fc" font-family="monospace" font-size="14">C · Java · Python · JavaScript</text>
<text x="28" y="358" fill="#f0f6fc" font-family="monospace" font-size="14">Git · GitHub · AWS · GCP</text>
<text x="28" y="400" fill="#58a6ff" font-family="monospace" font-size="14">status</text>
