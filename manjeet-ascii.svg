<defs>
<filter id="glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.a{font-family:"Courier New",monospace;font-size:10px;fill:#d7ffe8;opacity:0;animation:type .35s steps(1,end) forwards}
.scan{fill:none;stroke:#39d353;stroke-width:1;opacity:.10;animation:scan 3.5s linear infinite}
@keyframes type{from{opacity:0}to{opacity:1}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(450px)}}
</style>
</defs>
